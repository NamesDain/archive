name: Build and deploy

on:
  push:
    branches: [main]
  # Validates a PR before it lands. Only the build job runs here - deploying from
  # an unmerged branch would publish it to everyone who has the plugin installed.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Builds the bundle first, then runs the suite against the built output -
      # the tests load dist/ and evaluate it the way Kettu's loader does, so a
      # bundle that will not evaluate on device fails here instead.
      - run: npm test

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
