name: Build and test

# Publishing does NOT happen here. GitHub Pages serves docs/ straight from the
# branch, so the plugin ships without an Actions runner ever starting - which is
# why the deploy job that used to live in this file is gone. This workflow only
# checks the committed output is honest: built from the current sources, and
# still loadable the way Kettu's loader loads it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Builds the bundle first, then runs the suite against the built output -
      # the tests load dist/ and evaluate it the way Kettu's loader does, so a
      # bundle that will not evaluate on device fails here instead.
      - run: npm test

      # npm test rebuilds and re-mirrors into docs/. If that leaves the working
      # tree dirty, the committed copy Pages is serving was built from different
      # sources than the ones in this commit - people would install a stale
      # plugin and nothing else would say so.
      - name: docs/ is in sync with the sources
        run: |
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ is stale. Run 'npm run build' and commit the result."
            git diff --stat -- docs
            exit 1
          fi
